name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e platform/backend
      - name: Install frontend
        working-directory: platform/frontend
        run: npm ci
      - name: Backend compile
        run: PYTHONPATH=platform/backend python -m compileall -q platform/backend/app
      - name: Backend tests
        run: PYTHONPATH=platform/backend pytest -q platform/backend/tests
      - name: Frontend build
        working-directory: platform/frontend
        run: npm run build
      - name: Docker compose config
        run: docker compose -f docker/docker-compose.yml config >/tmp/grounded-compose.yml
